<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">Two exhibit arrangements</title><desc id="desc">Arrangement A separates a central paddle from its low donor label. Arrangement B places an explanatory account beside the paddle and a use diagram below.</desc><rect width="800" height="390" fill="#f6f1e6"/><g fill="none" stroke="#514940" stroke-width="2"><rect x="20" y="45" width="360" height="320"/><rect x="420" y="45" width="360" height="320"/><path d="M183 95h34v88q26 22 26 75h-86q0-53 26-75zM474 95h24v65q18 16 18 55h-60q0-39 18-55z"/><rect x="130" y="312" width="140" height="34"/><rect x="550" y="100" width="200" height="112"/><rect x="446" y="250" width="110" height="80"/><path d="M465 305h70m-50-5 20-35m-20 0 22 8"/></g><g font-family="Georgia,serif" fill="#302a25" font-size="18"><text x="20" y="28">A</text><text x="420" y="28">B</text><text x="143" y="334" font-size="14">Date · donor</text><text x="565" y="128">An account</text><text x="565" y="153">of washing</text><text x="565" y="193" font-size="14">Date · donor</text><text x="450" y="349" font-size="14">Diagram of use</text></g></svg>
